<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrossada Popular – 23 de Maig | Assemblea Popular de les Valls d'Àneu</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#c0281e">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #f5ede0;
            color: #1a1a1a;
            font-family: 'Oswald', sans-serif;
            min-height: 100vh;
            padding: 2rem 1rem 4rem;
        }

        .page-wrapper {
            max-width: 600px;
            margin: 0 auto;
        }

        /* ── Header ── */
        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .label-top {
            display: inline-block;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 4px;
            background: #1a1a1a;
            color: #f5ede0;
            padding: 4px 18px;
            margin-bottom: 0.4rem;
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(3rem, 12vw, 5.5rem);
            line-height: 0.9;
            color: #c0281e;
            text-shadow: 4px 4px 0 #1a1a1a;
            margin-bottom: 0.3rem;
        }

        .subtitle {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(1.2rem, 5vw, 1.8rem);
            letter-spacing: 3px;
            color: #1a1a1a;
        }

        .event-info {
            background: #c0281e;
            color: #f5ede0;
            border: 3px solid #1a1a1a;
            padding: 1rem 1.5rem;
            margin: 1.5rem 0;
            text-align: center;
        }

        .event-info p {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 1px;
            line-height: 1.8;
        }

        .event-info strong {
            font-size: 1.15rem;
        }

        /* ── Poster ── */
        .poster-wrap {
            background: #fff;
            border: 3px solid #1a1a1a;
            box-shadow: 6px 6px 0 #1a1a1a;
            padding: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .poster {
            display: block;
            width: 100%;
            height: auto;
        }

        /* ── Form card ── */
        .form-card {
            background: #fff;
            border: 3px solid #1a1a1a;
            box-shadow: 6px 6px 0 #1a1a1a;
            padding: 2rem 1.75rem;
        }

        .form-card h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.8rem;
            letter-spacing: 2px;
            color: #c0281e;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #1a1a1a;
            padding-bottom: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 0.4rem;
            color: #1a1a1a;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 0.7rem 0.9rem;
            border: 2px solid #1a1a1a;
            font-family: 'Oswald', sans-serif;
            font-size: 1rem;
            background: #f5ede0;
            color: #1a1a1a;
            appearance: none;
            -webkit-appearance: none;
            border-radius: 0;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #c0281e;
            box-shadow: 3px 3px 0 #c0281e;
        }

        .select-wrapper {
            position: relative;
        }

        .select-wrapper::after {
            content: '▾';
            position: absolute;
            right: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            font-size: 1rem;
            color: #1a1a1a;
        }

        /* vegetarian highlight */
        .vege-box {
            background: #f5ede0;
            border: 2px dashed #c0281e;
            padding: 1rem 1.25rem;
            margin-bottom: 1.25rem;
        }

        .vege-box label {
            color: #c0281e;
        }

        .vege-hint {
            font-size: 0.78rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            color: #666;
            margin-top: 0.35rem;
            text-transform: none;
        }

        /* radio group */
        .radio-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
        }

        .radio-option input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: #c0281e;
            cursor: pointer;
        }

        .radio-option span {
            font-size: 0.95rem;
            font-weight: 600;
        }

        /* price note */
        .price-note {
            background: #1a1a1a;
            color: #f5ede0;
            padding: 0.75rem 1rem;
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            line-height: 1.5;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .price-note strong {
            font-size: 1.1rem;
            font-family: 'Bebas Neue', sans-serif;
            letter-spacing: 2px;
        }

        /* bring reminder */
        .bring-note {
            background: #fff8e1;
            border: 2px solid #1a1a1a;
            padding: 0.75rem 1rem;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-align: center;
            margin-bottom: 1.5rem;
            color: #1a1a1a;
        }

        /* submit */
        button[type="submit"] {
            width: 100%;
            padding: 1rem;
            background: #c0281e;
            color: #f5ede0;
            border: 3px solid #1a1a1a;
            box-shadow: 4px 4px 0 #1a1a1a;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.6rem;
            letter-spacing: 3px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        button[type="submit"]:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 #1a1a1a;
        }

        button[type="submit"]:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 #1a1a1a;
        }

        /* success page (shown after Netlify redirect) */
        .success-banner {
            display: none;
            background: #c0281e;
            color: #f5ede0;
            border: 3px solid #1a1a1a;
            box-shadow: 6px 6px 0 #1a1a1a;
            padding: 2rem;
            text-align: center;
            margin-top: 1rem;
        }

        .success-banner h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.5rem;
            letter-spacing: 3px;
        }

        .success-banner p {
            font-size: 1rem;
            margin-top: 0.75rem;
            line-height: 1.6;
        }

        footer {
            text-align: center;
            margin-top: 2.5rem;
            font-size: 0.8rem;
            letter-spacing: 1px;
            color: #666;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="page-wrapper">

        <div class="poster-wrap">
            <img src="arrossada-poster.jpg" alt="Cartell Arrossada Popular - 23 de Maig 2026 al Firal d'Esterri. Aperitiu, arròs de muntanya, postres, vi i aigua. 15€ adults, 10€ menors d'edat. Només efectiu. Cal portar de casa coberts, plats i got. A partir de les 12:30h amb vermut electrònic i festa amb els PD's Musgoo i Celofana." class="poster">
        </div>

        <footer>
            <p>Assemblea Popular de les Valls d'Àneu &mdash; <a href="/" style="color:#c0281e;">assembleavallsdaneu.cat</a></p>
        </footer>
    </div>
</body>
</html>
